services:
  - type: web
    name: rocketcash
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm install && npm run build && npm run migrate
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: SUPER_ADMIN_CHAT_ID
        value: "8004114088"
      - key: DATABASE_URL
        fromDatabase:
          name: rocketcash-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: MINI_APP_URL
        sync: false
      - key: LOG_LEVEL
        value: info

databases:
  - name: rocketcash-db
    plan: starter
    region: singapore
    databaseName: rocketcash
    postgresMajorVersion: 16
