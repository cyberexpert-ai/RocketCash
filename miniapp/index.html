<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF6B35" />
  <title>RocketCash</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/miniapp/css/styles.css" />
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
      <div class="loading-logo">
        <span class="rocket-icon">🚀</span>
        <h1>RocketCash</h1>
      </div>
      <div class="loading-spinner"></div>
    </div>

    <!-- Maintenance Screen -->
    <div id="maintenance-screen" class="screen hidden">
      <div class="maintenance-content">
        <div class="maintenance-icon">🔧</div>
        <h2>Under Maintenance</h2>
        <p>We're improving RocketCash for you. Please check back shortly.</p>
      </div>
    </div>

    <!-- Main App -->
    <div id="main-app" class="hidden">
      <!-- Header -->
      <header class="app-header">
        <div class="header-left">
          <span class="logo-text">🚀 RocketCash</span>
        </div>
        <div class="header-right">
          <button class="icon-btn" id="notif-btn" title="Notifications">🔔</button>
        </div>
      </header>

      <!-- Page Content -->
      <main id="page-content" class="page-content"></main>

      <!-- Bottom Navigation -->
      <nav class="bottom-nav">
        <button class="nav-item active" data-page="home">
          <span class="nav-icon">🏠</span>
          <span class="nav-label">Home</span>
        </button>
        <button class="nav-item" data-page="tasks">
          <span class="nav-icon">🎯</span>
          <span class="nav-label">Tasks</span>
        </button>
        <button class="nav-item" data-page="spin">
          <span class="nav-icon">🎡</span>
          <span class="nav-label">Spin</span>
        </button>
        <button class="nav-item" data-page="invite">
          <span class="nav-icon">👥</span>
          <span class="nav-label">Invite</span>
        </button>
        <button class="nav-item" data-page="cashout">
          <span class="nav-icon">💰</span>
          <span class="nav-label">Cashout</span>
        </button>
      </nav>
    </div>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Modal overlay -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div id="modal-box" class="modal-box"></div>
    </div>
  </div>

  <script src="/miniapp/js/app.js"></script>
</body>
</html>
